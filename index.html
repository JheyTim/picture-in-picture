<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture in Picture</title>
    <link rel="icon" type="image/png" href="pip_logo.png" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      The selected screen, window, or tab stream plays in this video element.
      Keep it hidden on the page; JavaScript uses it as the picture-in-picture source.
      The id must match the video lookup in script.js.
    -->
    <video id="video" controls height="360" width="640" hidden></video>

    <!-- After choosing a sharing source, click START to open the floating video. -->
    <div class="button-container">
      <button id="button">START</button>
    </div>

    <!-- Load after the elements above so script.js can find them immediately. -->
    <script src="script.js"></script>
  </body>
</html>
